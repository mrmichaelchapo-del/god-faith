<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 30px;
      width: 320px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Login</h1>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Log In</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // Redirect user to the profile page
      window.location.href = "profile.html";
    });
  </script>
<script>
fetch("/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({{
  "username": "New user",
  "displayName": "not indexed"
  "userNumber": []
}})
});
</script>
<p>Login to access your prayers to God.</p>
<button onclick="composeGmail()">Compose Gmail</button>

<script>
  function composeGmail() {
    const to   = encodeURIComponent('contact@gmail.com');
    const subj = encodeURIComponent('Just one more step.');
    const body = encodeURIComponent('Your account has just been created! Your otp is sent and your verification code is 258542. - by PrayerAI Devs');

    const url =
      `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subj}&body=${body}`;

    window.open(url, '_blank');
  }
</script>
</body>
</html>
